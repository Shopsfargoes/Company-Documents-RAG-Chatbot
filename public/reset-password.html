<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password - Company Docs Assistant</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1>Choose a new password</h1>
    <p id="checking" class="muted">Checking your reset link&hellip;</p>
    <div id="notice" class="notice" role="status" hidden></div>

    <form id="reset-form" hidden>
      <label>New password (at least 10 characters)
        <input type="password" id="new-password" autocomplete="new-password" minlength="10" required>
      </label>
      <label>Confirm new password
        <input type="password" id="confirm-password" autocomplete="new-password" minlength="10" required>
      </label>
      <button type="submit">Update password</button>
    </form>

    <p id="back-link" hidden><a href="/login.html">Back to sign in</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
